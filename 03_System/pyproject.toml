[project]
name = "theology-ai-lab"
version = "4.1.0"
description = "Local-first theological research library with Streamlit, ChromaDB, and BGE-M3 embeddings"
requires-python = ">=3.11,<3.13"
readme = { text = "Theology AI Lab Local Edition", content-type = "text/markdown" }
dependencies = [
    "anthropic>=0.40.0",
    "chromadb>=0.5.0",
    "google-genai>=0.3.0",
    "langchain>=0.3.0",
    "langchain-chroma>=0.1.0",
    "langchain-classic>=1.0.0",
    "langchain-community>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-text-splitters>=0.3.0",
    "numpy>=1.24.0",
    "openai>=1.50.0",
    "pandas>=2.0.0",
    "pdf2image>=1.16.0",
    "pillow>=10.0.0",
    "pydantic>=2.0.0",
    "pymupdf>=1.23.0",
    "pytesseract>=0.3.10",
    "python-dotenv>=1.0.0",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=2.3.0",
    "streamlit>=1.30.0",
    "torch>=2.0.0",
    "tqdm>=4.66.0",
    "transformers>=4.30.0",
    "watchdog>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["app", "processor_v4"]

[tool.setuptools.packages.find]
include = ["pipeline*", "utils*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
